- id: Q14
  question: 强化学习设计文档中，PPO状态空间包含哪三类信息？
  golden_answer: "2.2 环境核心优势总结\n- 状态空间完整：融合外部市场与内部持仓绩效，决策逻辑更贴合机构实盘配置。\n- 交易规则合规：权重归一化约束，完全符合大类资产配置业务逻辑。\n\
    - 奖励机制金融化：将传统量化风控指标内嵌至训练梯度，让AI训练不再是黑盒拟合，而是遵循金融风控逻辑的可解释优化。\n关键优势：所有风险指标均采用历史时序数据（不含当日未来信息）计算，全程无数据泄露，训练逻辑严谨合规。\n\
    本模块为整个项目的核心规则载体，所有模型的训练逻辑、交易约束、奖惩规则均在此定义，区别于通用开源RL环境，是适配金融资产配置的定制化环境。\n环境核心逻辑分为三部分：\n- 完整状态空间构建：突破传统仅输入市场特征的局限，状态信息包含「精炼市场特征\
    \ + 当前资产持仓权重 + 组合实时净值」，让智能体同时感知外部市场行情与自身持仓状态，决策更贴合实盘逻辑。\n- 合法交易动作约束：通过Softmax函数将模型输出动作归一化为合法资产权重，保证所有权重非负、总和为1，严格匹配满仓资产配置的真实交易规则。\n\
    - 多维风控奖惩函数（核心创新）：摒弃单一收益奖励逻辑，构建兼顾收益与风险的平衡奖励体系：\n        \n1. 正向激励：基于当日组合收益给予正向奖励，鼓励模型累积超额收益；\n    \
    \    \n2. 波动惩罚：基于历史滚动波动率惩罚高震荡行情的激进持仓，抑制策略波动；\n        \n3. 回撤惩罚：基于历史滚动回撤进行风险惩罚，杜绝模型深度被套、持续亏损；\n  \
    \      \n4. 换手惩罚：对频繁调仓、大幅权重变动进行轻量化惩罚，降低无效交易成本，提升策略实盘可行性。"
