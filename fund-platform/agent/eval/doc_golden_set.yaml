  source: fund-platform/docs/评分系统金融规则.docx
  source_quote: '# 北向部分（满分10分）：净流入越多越好'
  authority: authoritative
- id: Q05
  question: 趋势分如何将价格偏离MA20的±5%映射为0至30分？
  golden_answer: '维度四：趋势（30%，权重最高）

    数据支撑：趋势跟踪是量化里最朴素但长期有效的策略。趋势维度在择时策略中通常赋予最高权重，因为“趋势一旦形成，短期不易逆转”。

    函数：

    def calc_trend_score(price, ma20):

    """

    price: 当日收盘价

    ma20: 20日均线

    输出: 0-30分

    """

    # 价格相对于MA20的偏离度

    deviation = (price / ma20 - 1) * 100  # 百分比

    if deviation >= 5.0:

    return 30.0

    elif deviation <= -5.0:

    return 0.0

    else:

    return 30.0 * (deviation + 5.0) / 10.0

    依据：

    1.阈值±5%：价格偏离MA20超过5%通常被视为趋势确立的信号

    2.满分30分：对应30%的最高权重——趋势是四维中最具预测力的维度'
